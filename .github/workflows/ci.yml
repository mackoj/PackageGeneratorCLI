name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    # swift-tools-version 6.2 needs Xcode 26, the default on this image.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcrun swift --version
      - name: Build
        run: xcrun swift build --build-tests
      - name: Test
        run: xcrun swift test
      - name: Release build
        run: xcrun swift build -c release --product package-generator-cli

  architecture:
    name: Architecture rules
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rules
        run: xcrun swift test --package-path Architecture
